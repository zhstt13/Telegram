name: Google Drive Sync Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "commands/command.json"
  workflow_dispatch:

concurrency:
  group: binary-drive-command
  cancel-in-progress: false

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Binary Hub
        run: |
          mkdir -p binary_hub/inbox/google-drive
          mkdir -p binary_hub/edit-queue
          mkdir -p binary_hub/outbox/telegram

      - name: Validate Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CREDENTIALS"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Intake latest Drive binary
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          python scripts/drive_sync.py

      - name: Commit Binary Hub state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binary_hub/
          if git diff --cached --quiet; then
            echo "No Binary Hub changes"
            exit 0
          fi
          git commit -m "Route latest Google Drive binary"
          git push
