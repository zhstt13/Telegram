name: Telegram Message Sender

on:
  push:
    paths:
      - "message.txt"
      - "outbox/send-photo.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing TELEGRAM_CHAT_ID"; exit 1; }

      - name: Detect changed payload
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "message=true" >> "$GITHUB_OUTPUT"
            echo "photo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git show --pretty='' --name-only "$AFTER")"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi

          if echo "$CHANGED" | grep -Fxq "message.txt"; then
            echo "message=true" >> "$GITHUB_OUTPUT"
          else
            echo "message=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -Fxq "outbox/send-photo.trigger"; then
            echo "photo=true" >> "$GITHUB_OUTPUT"
          else
            echo "photo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send text message
        if: steps.changed.outputs.message == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          MESSAGE="$(cat message.txt)"
          test -n "$MESSAGE" || { echo "message.txt is empty"; exit 1; }

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Rebuild and send photo
        if: steps.changed.outputs.photo == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          source outbox/send-photo.trigger
          test -n "${PARTS:-}" || { echo "PARTS missing"; exit 1; }
          test -n "${SHA256:-}" || { echo "SHA256 missing"; exit 1; }

          : > /tmp/photo.b64
          for i in $(seq -w 1 "$PARTS"); do
            part="outbox/photo_parts/part-${i}.b64"
            test -s "$part" || { echo "Missing $part"; exit 1; }
            cat "$part" >> /tmp/photo.b64
          done

          base64 --decode /tmp/photo.b64 > /tmp/photo.jpg
          test -s /tmp/photo.jpg || { echo "Decoded photo is empty"; exit 1; }
          echo "${SHA256}  /tmp/photo.jpg" | sha256sum --check -

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "photo=@/tmp/photo.jpg;type=image/jpeg"
