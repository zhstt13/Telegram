name: Cloudflare Credential Check
on:
  push:
    paths:
      - ".github/workflows/check-cloudflare.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN_PRESENT=true"
          else
            echo "CLOUDFLARE_API_TOKEN_PRESENT=false"
            exit 2
          fi
